name: MoonBit CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup MoonBit
        uses: hustcer/setup-moonbit@9199da0ab63ea0c0bab1dc15f03d76e17ed4f75f # v1.22
        with:
          version: 'latest'
          core-version: 'latest'
      - name: Toolchain versions
        run: moon version --all
      - name: Check
        run: moon check
      - name: Test
        run: moon test
      - name: Build
        run: moon build
      - name: Run example
        run: moon run examples/basic
      - name: CLI smoke tests
        run: |
          moon run cli --target js -- detect fixtures/rss/full.xml
          moon run cli --target js -- inspect fixtures/atom/full.xml
          moon run cli --target js -- normalize fixtures/jsonfeed/full.json > normalized.json
          node -e "JSON.parse(require('fs').readFileSync('normalized.json', 'utf8'))"
